services:
  seed:
    build:
      context: ..
      dockerfile: previews/Dockerfile.seed
    environment:
      PREVIEW_ENVIRONMENT: ${PREVIEW_ENVIRONMENT}
      PREVIEW_MONGO_ADMIN_URI: ${PREVIEW_MONGO_ADMIN_URI}
      SEED_SOURCES_JSON: ${SEED_SOURCES_JSON}
      PREVIEW_DATABASE_CREDENTIALS_JSON: ${PREVIEW_DATABASE_CREDENTIALS_JSON}
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    networks: [preview, coolify]

  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [preview]

  auth:
    build:
      context: https://github.com/leia-org/leia-auth.git#${AUTH_COMMIT}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY . .
        RUN npm ci --omit=dev && npm cache clean --force
        EXPOSE 3000
        CMD ["node", "-e", "Object.assign(process.env, JSON.parse(process.env.APP_CONFIG_JSON)); delete process.env.APP_CONFIG_JSON; import('./src/index.js')"]
    environment:
      APP_CONFIG_JSON: ${AUTH_CONFIG_JSON}
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck: &api-health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/', {method:'OPTIONS'}).then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 20
    networks:
      preview:
        aliases: ["auth-${PREVIEW_ENVIRONMENT}"]
      coolify: {}

  designer:
    build:
      context: https://github.com/leia-org/leia-designer-backend.git#${DESIGNER_COMMIT}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY . .
        RUN npm ci --omit=dev && npm cache clean --force
        EXPOSE 3000
        CMD ["node", "-e", "Object.assign(process.env, JSON.parse(process.env.APP_CONFIG_JSON)); delete process.env.APP_CONFIG_JSON; import('./src/index.js')"]
    environment:
      APP_CONFIG_JSON: ${DESIGNER_CONFIG_JSON}
    depends_on:
      seed: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck: *api-health
    networks:
      preview:
        aliases: ["designer-${PREVIEW_ENVIRONMENT}"]
      coolify: {}

  workbench:
    build:
      context: https://github.com/leia-org/leia-workbench-backend.git#${WORKBENCH_COMMIT}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY . .
        RUN npm ci --omit=dev && npm cache clean --force
        EXPOSE 3000
        CMD ["node", "-e", "Object.assign(process.env, JSON.parse(process.env.APP_CONFIG_JSON)); delete process.env.APP_CONFIG_JSON; import('./src/index.js')"]
    environment:
      APP_CONFIG_JSON: ${WORKBENCH_CONFIG_JSON}
    depends_on:
      seed: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck: *api-health
    networks:
      preview:
        aliases: ["workbench-${PREVIEW_ENVIRONMENT}"]
      coolify: {}

  runner:
    build:
      context: https://github.com/leia-org/leia-runner.git#${RUNNER_COMMIT}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY . .
        RUN npm ci --omit=dev && npm cache clean --force
        EXPOSE 3000
        CMD ["node", "-e", "Object.assign(process.env, JSON.parse(process.env.APP_CONFIG_JSON)); delete process.env.APP_CONFIG_JSON; import('./server.js')"]
    environment:
      APP_CONFIG_JSON: ${RUNNER_CONFIG_JSON}
    depends_on:
      seed: {condition: service_completed_successfully}
      auth: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck: *api-health
    networks:
      preview:
        aliases: ["runner-${PREVIEW_ENVIRONMENT}"]
      coolify: {}

networks:
  preview: {}
  coolify:
    external: true
