name: Promote develop to main
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component (Designer and Workbench include frontend and backend)
        type: choice
        default: all
        options: [all, auth, designer, workbench, runner]
      dry_run:
        description: Only show the plan, without creating release PRs
        type: boolean
        default: false
concurrency:
  group: leia-production-promotions
  cancel-in-progress: false
permissions: {}
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node previews/app-token.mjs
        env:
          LEIA_BOT_APP_ID: ${{ vars.LEIA_BOT_APP_ID }}
          LEIA_BOT_INSTALLATION_ID: ${{ vars.LEIA_BOT_INSTALLATION_ID }}
          LEIA_BOT_PRIVATE_KEY: ${{ secrets.LEIA_BOT_PRIVATE_KEY }}
      - name: Create or reuse release PRs
        run: |
          if [ "$DRY_RUN" = true ]; then
            node previews/promote.mjs
          else
            node previews/promote.mjs --apply
          fi
        env:
          PROMOTION_COMPONENT: ${{ inputs.component }}
          DRY_RUN: ${{ inputs.dry_run }}
