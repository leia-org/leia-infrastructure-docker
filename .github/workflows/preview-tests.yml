name: Preview coordinator tests
on:
  pull_request:
    paths: ['previews/**', 'agent/**', 'test-login/**', '.github/workflows/preview-tests.yml', '.github/workflows/leia-agent.yml']
  push:
    branches: [main, build/coolify-linked-previews]
    paths: ['previews/**', 'agent/**', 'test-login/**', '.github/workflows/preview-tests.yml', '.github/workflows/leia-agent.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix previews
      - run: npm test --prefix previews
      - run: node --test agent/*.test.mjs agent/events/*.test.mjs
      - run: node --test test-login/*.test.mjs
      - name: Verify generated Compose subsets
        run: |
          node previews/compose.mjs
          git diff --exit-code -- previews/stacks
